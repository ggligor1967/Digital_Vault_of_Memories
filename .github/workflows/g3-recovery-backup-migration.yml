name: G3 Recovery Backup and Migration
on:
  push:
    branches: [main, feat/dvm-v2-g3-recovery-backup-migration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Repository-owned G3 gate
        shell: pwsh
        run: pnpm verify:g3 --ci
