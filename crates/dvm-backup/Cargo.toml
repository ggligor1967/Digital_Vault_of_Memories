[package]
name = "dvm-backup"
description = "DVBK1 backup, verification and restore for Digital Vault of Memories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
dvm-domain.workspace = true
dvm-storage.workspace = true
dvm-crypto.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
tar = "=0.4.46"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct dependency for atomic RENAME_NOREPLACE directory publication.
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }
