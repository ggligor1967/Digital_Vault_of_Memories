[package]
name = "dvm-crypto"
description = "Cryptographic primitives, key hierarchy and DVB1 blob framing for Digital Vault of Memories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Only the private sodium FFI adapter may allow unsafe; see ADR-0007.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
dvm-domain.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
libsodium-sys-stable.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
