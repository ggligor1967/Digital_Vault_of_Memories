# Pinned Rust toolchain for the Digital Vault of Memories workspace.
#
# Pinned to an exact release (not "stable") so that clippy lint sets — and
# therefore `cargo clippy -D warnings` — are reproducible in a clean clone and
# in CI (Blueprint v2 §7.1).
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
profile = "minimal"
